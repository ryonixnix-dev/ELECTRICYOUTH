<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYONIX - ELECTRIC YOUTH</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="content-wrapper"> 
        <div class="container">
            
            <div class="header">
                
                <div class="album-wrapper">
                    <img src="ryonixcover.png" alt="RYONIX Album Cover" class="album-art" id="albumArt">
                    
                    <div class="play-overlay" id="playOverlay">
                        <span class="play-icon">▶</span>
                    </div>
                </div>

                <p id="nowPlayingText" class="preview-text">Click cover to preview album</p>

                <h1 class="album-title">RYONIX - ELECTRIC YOUTH</h1>
                <p class="subtitle">Select Music Service</p>
                <p class="copyright-text">© 2025 RY ENTERTAINMENT</p>
            </div>

            <audio id="audioPlayer"></audio>

            <div class="link-cards">
                <a href="https://music.youtube.com/playlist?list=OLAK5uy_mupY6IzedmYfGcywGKlNvI6hRdMl5M2KQ&si=Ww5UrXwoNxl9KDPQ" class="card ytmusic-card" target="_blank">
                    <div class="card-left">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Youtube_Music_icon.svg" alt="YouTube Music Icon" class="icon-img">
                        <span class="service-name">YouTube Music</span>
                    </div>
                    <span class="button-label play-button">Listen Now</span>
                </a>

                <a href="https://open.spotify.com/intl-id/album/3XiVwBjJHgml0aLnhR2xwd?si=wtPGJP2PSxS45Fzet7SP9w" class="card spotify-card" target="_blank"> 
                    <div class="card-left">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" alt="Spotify Icon" class="icon-img">
                        <span class="service-name">Spotify</span>
                    </div>
                    <span class="button-label play-button">Play</span>
                </a>

                <a href="https://link.deezer.com/s/31DZu9AmOliBJshwpo76D" class="card deezer-card" target="_blank"> 
                    <div class="card-left">
                        <img src="https://images.seeklogo.com/logo-png/50/3/deezer-logo-png_seeklogo-507119.png" alt="Deezer Icon" class="icon-img">
                        <span class="service-name">Deezer</span>
                    </div>
                    <span class="button-label play-button">Stream</span>
                </a>

                <a href="https://music.amazon.in/albums/B0G2Q3XJ7P?marketplaceId=A21TJRUUN4KGV&musicTerritory=IN&ref=dm_sh_o8LhV4KgPvqENuM7I3UI6TJc8" class="card amazonmusic-card" target="_blank">
                    <div class="card-left">
                        <img src="https://static.vecteezy.com/system/resources/previews/067/941/727/non_2x/amazon-music-logo-rounded-hd-free-png.png" alt="Amazon Music Icon" class="icon-img">
                        <span class="service-name">Amazon Music</span>
                    </div>
                    <span class="button-label play-button">Stream</span>
                </a>
            </div>
        </div>
    </div> 

    <script src="script.js"></script>
</body>
</html>
